name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/runtime --frozen
      - run: pnpm generate api
      - name: Verify generated API types are current
        run: git diff --exit-code -- packages/api-client/src/generated-schema.d.ts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build web

  coding-bundle:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and check the deployed Coding bundle
        run: pnpm build coding-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coding-bundle-evidence
          path: |
            .build/coding/bundle-size.json
            .build/coding/bundle-check.json
            apps/desktop/src-tauri/resources/coding-agent/provenance.json
          if-no-files-found: warn
          retention-days: 7

  installer:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installation and replacement using a signed fixture DMG
        run: python -m scripts.acceptance.verify_installer --output .build/installer/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence
          path: .build/installer/report.json
          if-no-files-found: warn
          retention-days: 7

  runtime-bundle:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Build the release Runtime with its dependency policy
        run: bash scripts/build/build-runtime.sh
      - name: Check imports and resources inside the frozen Runtime
        shell: bash
        run: |
          set -euo pipefail
          status=0
          apps/desktop/src-tauri/binaries/mlx-studio-runtime-aarch64-apple-darwin \
            --check-bundle > .build/runtime/bundle-check.json || status=$?
          cat .build/runtime/bundle-check.json
          exit "$status"
      - name: Exercise the frozen Runtime protocol and process cleanup
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.build/runtime/venv-release
          PYTHONPATH: services/runtime/src
        run: |
          uv run --frozen --no-sync --project services/runtime --python 3.12 \
            python -m scripts.acceptance.verify_packaged_runtime \
            --sidecar apps/desktop/src-tauri/binaries/mlx-studio-runtime-aarch64-apple-darwin
          uv run --frozen --no-sync --project services/runtime --python 3.12 \
            python -m scripts.acceptance.verify_desktop_shutdown \
            --sidecar apps/desktop/src-tauri/binaries/mlx-studio-runtime-aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-bundle-evidence
          path: |
            .build/runtime/archive-size.json
            .build/runtime/bundle-check.json
          if-no-files-found: warn
          retention-days: 7

  rust:
    runs-on: macos-14
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Provide sidecar placeholder for compile-time validation
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/mlx-studio-runtime-aarch64-apple-darwin
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
